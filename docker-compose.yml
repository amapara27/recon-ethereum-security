version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persistent database for fraud alerts
      - ./backend/database/alerts.db:/app/backend/database/alerts.db
      # Cache database for smart contract analyses (reduces API costs)
      - ./backend/database/contract_cache.db:/app/backend/database/contract_cache.db
      # Pre-trained ML models
      - ./backend/app/models:/app/backend/app/models
      # Address lists (whitelists, blacklists, etc.)
      - ./backend/app/config/lists:/app/backend/app/config/lists
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s